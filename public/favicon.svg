<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 外框：圆角矩形 -->
  <rect width="32" height="32" rx="7" fill="#4f46e5"/>

  <!-- 分支汇聚：两条分支汇入主线 -->
  <!-- 上分支 -->
  <path d="M8 10 L8 14 L14 18 L14 22" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8" cy="10" r="2.2" fill="white"/>
  <!-- 下分支 -->
  <path d="M24 10 L24 14 L18 18 L18 22" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="10" r="2.2" fill="white"/>
  <!-- 汇聚主线 -->
  <path d="M14 22 L16 24 L18 22" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="24" r="2.2" fill="white"/>
</svg>
